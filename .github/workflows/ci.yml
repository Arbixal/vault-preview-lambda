name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build solution
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          version: 1.166.2
          use-installer: true

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: contracts/v1/fixtures/package-lock.json

      - name: Restore dependencies
        run: dotnet restore VaultPreviewLambda.sln

      - name: Validate contract fixtures
        working-directory: contracts/v1/fixtures
        run: npm ci && npm run validate

      - name: Validate SAM templates
        run: |
          sam validate --lint --template-file src/VaultPreviewLambda/serverless.template
          sam validate --lint --template-file src/CharacterDataLambda/serverless.template
          sam validate --lint --template-file src/SeasonActivationLambda/serverless.template

      - name: Build
        run: dotnet build VaultPreviewLambda.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test VaultPreviewLambda.sln --configuration Release --no-build --no-restore
