name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build solution
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore VaultPreviewLambda.sln

      - name: Build
        run: dotnet build VaultPreviewLambda.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test VaultPreviewLambda.sln --configuration Release --no-build --no-restore
