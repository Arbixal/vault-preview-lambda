name: Season Configuration Activate

on:
  workflow_dispatch:
    inputs:
      season_id:
        description: Public season ID
        required: true
        type: string
      revision_id:
        description: Immutable revision ID to activate
        required: true
        type: string
      activation_at:
        description: Optional ISO-8601 activation timestamp; omit for immediate activation
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  activate:
    uses: ./.github/workflows/season-config-operation.yml
    with:
      operation: activate
      season_id: ${{ inputs.season_id }}
      revision_id: ${{ inputs.revision_id }}
      activation_at: ${{ inputs.activation_at }}
